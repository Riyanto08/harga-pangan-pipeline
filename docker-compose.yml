services:
  airflow:
    build: .
    container_name: airflow_harga_pangan
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Jakarta"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      DBT_PROFILES_DIR: /opt/project/dbt_profiles
    volumes:
      - ./dags:/opt/airflow/dags
      - ./extract:/opt/project/extract
      - ./dbt_harga_pangan:/opt/project/dbt_harga_pangan
      - ./credentials:/opt/project/credentials:ro
      - ./data:/opt/project/data
      - ./dbt_profiles:/opt/project/dbt_profiles